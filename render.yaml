services:
  - type: web
    name: movie-recommender-api
    env: python
    buildCommand: |
      apt-get update && apt-get install -y gcc
      cd c_engine && gcc -o recommender recommender.c -lm
      cd c_engine && gcc -o movie_system system_main.c auth.c comments.c chat.c mylist.c utils.c -lm
      pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
